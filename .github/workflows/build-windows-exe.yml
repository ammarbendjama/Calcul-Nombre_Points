name: Build Windows EXE et publication

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller

      - name: Lancer les tests
        run: python -m pytest tests/ -q

      - name: Compiler l'exécutable
        run: python -m PyInstaller windows/NombrePoints.spec --distpath dist --workpath build

      - name: Préparer l'archive
        shell: pwsh
        run: Compress-Archive -Path dist/NombrePoints.exe -DestinationPath NombrePoints-Windows.zip

      - name: Joindre l'archive au run (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: NombrePoints-Windows
          path: NombrePoints-Windows.zip

      - name: Publier dans Releases (lien permanent)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NombrePoints — dernière version
          files: NombrePoints-Windows.zip
          make_latest: true
